name: Build APK from Uploaded ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File Automatically
        run: |
          echo "Unzipping uploaded project ZIP..."
          unzip -o dhanraj-games-source.zip -d extracted_project || unzip -o *.zip -d extracted_project
          ls -la extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Locate Flutter App Directory
        id: locate
        run: |
          if [ -f "extracted_project/flutter_app/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project/flutter_app" >> $GITHUB_ENV
          elif [ -f "extracted_project/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project" >> $GITHUB_ENV
          else
            echo "Searching for pubspec.yaml..."
            FOUND_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
            echo "FLUTTER_DIR=$FOUND_DIR" >> $GITHUB_ENV
          fi

      - name: Auto-Detect Package Name, Fix Imports & Build APK
        run: |
          cd ${{ env.FLUTTER_DIR }}
          
          # Clean old Android scaffold & recreate fresh
          rm -rf android
          flutter create . --platforms=android --org=com.dhanraj.games
          
          # Get actual package name from pubspec.yaml
          PKG_NAME=$(grep "^name:" pubspec.yaml | awk '{print $2}' | tr -d '\r"' "'")
          echo "Detected Package Name: $PKG_NAME"
          
          # Auto-Fix main.dart imports to use relative or exact package name
          if [ -f "lib/main.dart" ]; then
            sed -i "s|import 'package:dhanraj_games/|import 'package:$PKG_NAME/|g" lib/main.dart || true
            sed -i "s|import 'screens/|import 'package:$PKG_NAME/screens/|g" lib/main.dart || true
            sed -i "s|import 'providers/|import 'package:$PKG_NAME/providers/|g" lib/main.dart || true
          fi

          # Get dependencies
          flutter pub get
          
          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
