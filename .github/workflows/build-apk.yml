name: Build APK from Uploaded ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File Automatically
        run: |
          echo "Unzipping uploaded project ZIP..."
          unzip -o dhanraj-games-source.zip -d extracted_project || unzip -o *.zip -d extracted_project
          ls -la extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Locate Flutter App Directory
        id: locate
        run: |
          if [ -f "extracted_project/flutter_app/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project/flutter_app" >> $GITHUB_ENV
          elif [ -f "extracted_project/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project" >> $GITHUB_ENV
          else
            echo "Searching for pubspec.yaml..."
            FOUND_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
            echo "FLUTTER_DIR=$FOUND_DIR" >> $GITHUB_ENV
          fi

      - name: Fix Package Name & Build APK
        run: |
          cd ${{ env.FLUTTER_DIR }}
          
          # Extract actual package name from pubspec.yaml automatically
          PKG_NAME=$(grep "^name:" pubspec.yaml | head -n 1 | awk '{print $2}' | tr -d '\r"' "'")
          echo "Using Exact Package Name: $PKG_NAME"
          
          # Update all package imports in lib/main.dart to match the exact package name
          if [ -f "lib/main.dart" ]; then
            python3 -c "
            import re
            with open('lib/main.dart', 'r') as f:
                content = f.read()
            # Replace any old package imports with the correct dynamic package name
            content = re.sub(r'package:[^/]+/', 'package:$PKG_NAME/', content)
            with open('lib/main.dart', 'w') as f:
                f.write(content)
            "
          fi

          # Get dependencies
          flutter pub get
          
          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
