name: Build APK from Uploaded ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unzip Project File Automatically
        run: |
          echo "Unzipping uploaded project ZIP..."
          unzip -o dhanraj-games-source.zip -d extracted_project || unzip -o *.zip -d extracted_project
          ls -la extracted_project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'

      - name: Locate Flutter App Directory
        id: locate
        run: |
          if [ -f "extracted_project/flutter_app/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project/flutter_app" >> $GITHUB_ENV
          elif [ -f "extracted_project/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=extracted_project" >> $GITHUB_ENV
          else
            echo "Searching for pubspec.yaml..."
            FOUND_DIR=$(find extracted_project -name "pubspec.yaml" -exec dirname {} \;)
            echo "FLUTTER_DIR=$FOUND_DIR" >> $GITHUB_ENV
          fi

      - name: Clean Android Scaffold & Safe Fix Imports
        run: |
          cd ${{ env.FLUTTER_DIR }}
          
          # Clean broken android folder & recreate fresh scaffold
          rm -rf android
          flutter create . --platforms=android --org=com.dhanraj.games
          
          # Python script to ONLY replace local project imports, keeping flutter/ imports intact
          python3 -c "
          import os, re

          pkg_name = 'flutter_app'
          if os.path.exists('pubspec.yaml'):
              with open('pubspec.yaml', 'r') as f:
                  for line in f:
                      if line.startswith('name:'):
                          pkg_name = line.split(':')[1].strip().strip('\"\'\r')
                          break
          print('Project Package Name:', pkg_name)

          if os.path.exists('lib/main.dart'):
              with open('lib/main.dart', 'r') as f:
                  content = f.read()
              
              # Replace 'package:dhanraj_games/' with correct package name
              content = re.sub(r'package:dhanraj_games/', f'package:{pkg_name}/', content)
              
              # Fix relative imports if any
              content = re.sub(r\"import\s+['\"]screens/\", f\"import 'package:{pkg_name}/screens/\", content)
              content = re.sub(r\"import\s+['\"]providers/\", f\"import 'package:{pkg_name}/providers/\", content)
              
              with open('lib/main.dart', 'w') as f:
                  f.write(content)
              print('Successfully updated main.dart safely!')
          "

          # Get dependencies
          flutter pub get
          
          # Build Release APK
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: ${{ env.FLUTTER_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
